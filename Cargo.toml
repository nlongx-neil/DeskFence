[package]
name = "deskkeeper"
version = "0.1.0"
edition = "2021"
description = "DeskKeeper - 纯 Rust 桌面整理工具与剪贴板历史"
license = "MIT"
rust-version = "1.89"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard"] }
egui = "0.37"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
log = "0.4"
anyhow = "1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# 文本预览编码兜底（GBK/GB18030）
encoding_rs = "0.8"
# Office（docx/xlsx/pptx）内容抽取：ZIP 解包 + 极简 XML 文本节点扫描
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
default = []
# 诊断构建：启动链路逐阶段写日志，panic/致命错误弹消息框。
diag = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
